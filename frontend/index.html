<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NCERT Class 12 Tutor</title>
    <script>
      window.MathJax = {
        tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] },
        svg: { fontCache: "global" },
        options: { skipHtmlTags: ["script", "noscript", "style", "textarea"] },
      };
    </script>
    <script
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
    <style>
      :root {
        --paper: #faf8f3;
        --surface: #ffffff;
        --ink: #1f2540;
        --indigo: #26346b;
        --marigold: #c97a1a;
        --marigold-soft: #f6ecd8;
        --muted: #6b7185;
        --hair: #e7e3d8;
        --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.6;
        display: flex;
        justify-content: center;
      }
      .app {
        width: 100%;
        max-width: 760px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 22px 24px 16px;
        border-bottom: 1px solid var(--hair);
      }
      header h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 24px;
        letter-spacing: -0.01em;
        margin: 0;
      }
      header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13.5px;
      }

      #thread {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .msg {
        max-width: 90%;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--indigo);
        color: #fff;
        padding: 10px 14px;
        border-radius: 14px 14px 4px 14px;
      }
      .msg.tutor {
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--hair);
        border-left: 3px solid var(--marigold);
        padding: 14px 16px;
        border-radius: 4px 14px 14px 14px;
      }
      .msg.tutor.plain {
        border-left-color: var(--hair);
      }
      .msg p {
        margin: 0 0 10px;
      }
      .msg p:last-child {
        margin-bottom: 0;
      }

      .sources {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px dashed var(--hair);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .sources .tag {
        font-size: 11.5px;
        color: var(--marigold);
        background: var(--marigold-soft);
        border-radius: 4px;
        padding: 2px 8px;
        white-space: nowrap;
      }

      /* empty state */
      .intro {
        margin: auto 0;
        text-align: center;
        color: var(--muted);
      }
      .intro h2 {
        font-family: var(--serif);
        color: var(--ink);
        font-weight: 600;
        font-size: 20px;
        margin: 0 0 6px;
      }
      .examples {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 18px;
      }
      .example {
        font-family: var(--sans);
        font-size: 14px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 10px 14px;
        text-align: left;
        cursor: pointer;
      }
      .example:hover {
        border-color: var(--indigo);
      }

      /* typing */
      .typing {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        color: var(--muted);
        font-size: 13.5px;
      }
      .typing i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--marigold);
        display: inline-block;
        animation: blink 1.2s infinite;
      }
      .typing i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        60%,
        100% {
          opacity: 0.25;
        }
        30% {
          opacity: 1;
        }
      }

      /* composer */
      form {
        display: flex;
        gap: 10px;
        padding: 14px 24px 20px;
        border-top: 1px solid var(--hair);
        background: var(--paper);
      }
      #box {
        flex: 1;
        resize: none;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--hair);
        border-radius: 12px;
        padding: 11px 14px;
        max-height: 140px;
      }
      #box:focus {
        outline: 2px solid var(--indigo);
        outline-offset: 1px;
      }
      button.ask {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--indigo);
        border: none;
        border-radius: 12px;
        padding: 0 18px;
        cursor: pointer;
      }
      button.ask:disabled {
        opacity: 0.45;
        cursor: default;
      }

      @media (prefers-reduced-motion: reduce) {
        .typing i {
          animation: none;
        }
      }
      @media (max-width: 640px) {
        .msg {
          max-width: 96%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>NCERT Class 12 Tutor</h1>
        <p>
          Maths · Physics · Chemistry — answered from the textbooks, with
          citations.
        </p>
      </header>

      <div id="thread">
        <div class="intro" id="intro">
          <h2>Ask about the Class 12 syllabus</h2>
          <div>
            Answers come only from the NCERT books, with the chapter and page
            cited.
          </div>
          <div class="examples">
            <button class="example">
              Explain the difference between definite and indefinite integrals.
            </button>
            <button class="example">
              What is the difference between EMF and terminal voltage?
            </button>
            <button class="example">
              What are coordination compounds? Explain ligand and coordination
              number.
            </button>
          </div>
        </div>
      </div>

      <form id="composer">
        <textarea
          id="box"
          rows="1"
          placeholder="Ask a question…"
          autocomplete="off"
        ></textarea>
        <button class="ask" type="submit">Ask</button>
      </form>
    </div>

    <script>
      const thread = document.getElementById("thread");
      const intro = document.getElementById("intro");
      const box = document.getElementById("box");
      const form = document.getElementById("composer");
      const askBtn = form.querySelector(".ask");

      // full conversation history sent to /chat each turn
      const history = [];

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // minimal, math-safe rendering: escape, bold **x**, paragraphs; MathJax does the math
      function renderAnswer(text) {
        let s = escapeHtml(text).replace(
          /\*\*([^*]+)\*\*/g,
          "<strong>$1</strong>"
        );
        return s
          .split(/\n\n+/)
          .map((p) => "<p>" + p.replace(/\n/g, "<br>") + "</p>")
          .join("");
      }

      function addUser(text) {
        const el = document.createElement("div");
        el.className = "msg user";
        el.textContent = text;
        thread.appendChild(el);
        scroll();
      }

      function addTutor(answer, sources) {
        const el = document.createElement("div");
        el.className =
          "msg tutor" + (sources && sources.length ? "" : " plain");
        el.innerHTML = renderAnswer(answer);
        if (sources && sources.length) {
          const box = document.createElement("div");
          box.className = "sources";
          for (const s of sources) {
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = s;
            box.appendChild(tag);
          }
          el.appendChild(box);
        }
        thread.appendChild(el);
        if (window.MathJax && MathJax.typesetPromise)
          MathJax.typesetPromise([el]);
        scroll();
      }

      function addTyping() {
        const el = document.createElement("div");
        el.className = "msg tutor plain";
        el.id = "typing";
        el.innerHTML =
          '<span class="typing">Searching the textbooks <i></i><i></i><i></i></span>';
        thread.appendChild(el);
        scroll();
      }
      function removeTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
      }

      function scroll() {
        thread.scrollTop = thread.scrollHeight;
      }

      async function ask(text) {
        if (intro) intro.remove();
        addUser(text);
        history.push({ role: "user", content: text });
        setBusy(true);
        addTyping();
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history }),
          });
          removeTyping();
          if (!res.ok) {
            addTutor(
              "Something went wrong reaching the tutor (status " +
                res.status +
                "). Is the server running?",
              []
            );
            return;
          }
          const data = await res.json();
          addTutor(data.answer, data.sources);
          history.push({ role: "assistant", content: data.answer });
        } catch (e) {
          removeTyping();
          addTutor(
            "Could not reach the server. Check that it is running on this port.",
            []
          );
        } finally {
          setBusy(false);
        }
      }

      function setBusy(on) {
        askBtn.disabled = on;
        box.disabled = on;
        if (!on) box.focus();
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = box.value.trim();
        if (!text) return;
        box.value = "";
        box.style.height = "auto";
        ask(text);
      });

      // Enter to send, Shift+Enter for newline; auto-grow
      box.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
      box.addEventListener("input", () => {
        box.style.height = "auto";
        box.style.height = Math.min(box.scrollHeight, 140) + "px";
      });

      document
        .querySelectorAll(".example")
        .forEach((b) => b.addEventListener("click", () => ask(b.textContent)));
    </script>
  </body>
</html>
